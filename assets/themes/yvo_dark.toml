# yvo-dark — the default yvo theme.
#
# Hand-ported from the original Theme::default_dark() palette so users see the
# exact same colors after the Opaline integration. Most colors used by the yvo
# UI are defined as `yvo.<field>` tokens below; user-authored themes can either
# define the same tokens explicitly, or rely on the built-in fallback that
# derives them from Opaline's standard semantic tokens (text.*, accent.*, etc.).
# GitHub PR colors intentionally are not listed here: missing `yvo.pr_*` tokens
# fall back to fixed GitHub open/closed/merged colors instead of the active
# theme palette. User-authored themes may still define those tokens explicitly.
#
# Named ratatui colors (Cyan, Yellow, Red, Green, Magenta, White, Black,
# DarkGray) have been expanded to their canonical 24-bit RGB. On most modern
# true-color terminals the rendering is identical; terminals that remap the
# 16-color ANSI palette via their profile will now see these literal RGB
# values rather than the user-customized "Cyan", which matches what most TUI
# theme engines do.

[meta]
name = "yvo_dark"
author = "yvo"
variant = "dark"
description = "The default yvo dark theme."

[palette]
# Named ANSI canonical RGB
ansi_white   = "#ffffff"
ansi_black   = "#000000"
ansi_cyan    = "#00ffff"
ansi_yellow  = "#ffff00"
ansi_red     = "#ff0000"
ansi_green   = "#00ff00"
ansi_magenta = "#ff00ff"
ansi_darkgray = "#808080"

[tokens]
# ── Frame-wide surface ───────────────────────────────────────────────
# Painted across the whole yvo frame before any widget renders. Anything
# that does not set its own background — modal interiors, gutters,
# the strip under the PR banner — will sit on top of this color.
"yvo.app_bg"               = "#141414"
# Primary body-text color used by spans that don't set an explicit
# foreground (project names, modal "Current: …" labels, etc.). Without
# this, those spans fall through to the user's terminal default fg and
# become invisible on light themes.
"yvo.text_fg"              = "ansi_white"

# ── Header / chrome ──────────────────────────────────────────────────
"yvo.header_fg"            = "ansi_white"
"yvo.header_bg"            = "#1e1e1e"
"yvo.header_label_fg"      = "#787878"
"yvo.header_separator_fg"  = "#3c3c3c"

# ── Borders & titles ─────────────────────────────────────────────────
"yvo.border_focused"       = "ansi_cyan"
"yvo.border_normal"        = "#505050"
"yvo.title_focused"        = "ansi_cyan"
"yvo.title_normal"         = "#8c8c8c"

# ── Selection ────────────────────────────────────────────────────────
"yvo.selection_fg"         = "ansi_black"
"yvo.selection_bg"         = "ansi_cyan"

# ── Project & session indicators ─────────────────────────────────────
"yvo.project_icon"         = "#6495ed"
"yvo.project_missing_fg"   = "#b4a050"
"yvo.related_link_fg"      = "#78aadc"
"yvo.session_active"       = "#d2d2d2"
"yvo.session_detached"     = "ansi_yellow"
"yvo.session_exited"       = "#646464"
"yvo.session_deleting"     = "#646464"

# ── Status line ──────────────────────────────────────────────────────
"yvo.status_info_fg"       = "#646464"
"yvo.status_info_bg"       = "#191919"
"yvo.status_busy_fg"       = "ansi_yellow"
"yvo.status_busy_bg"       = "#28230f"
"yvo.status_error_fg"      = "ansi_red"
"yvo.status_error_bg"      = "#321414"

# ── Diff visualization ───────────────────────────────────────────────
"yvo.diff_add"             = "ansi_green"
"yvo.diff_remove"          = "ansi_red"
"yvo.diff_hunk"            = "ansi_magenta"
"yvo.diff_file_header"     = "ansi_white"
"yvo.file_status_fg"       = "ansi_yellow"
"yvo.diff_add_bg"          = "#143214"
"yvo.diff_remove_bg"       = "#3c1414"
"yvo.diff_binary_fg"       = "ansi_yellow"
"yvo.diff_stat_add_fg"     = "ansi_green"
"yvo.diff_stat_remove_fg"  = "ansi_red"
"yvo.diff_line_number_fg"  = "#5a5a6e"
"yvo.diff_line_number_sep" = "#3c3c46"

# ── Hint / footer bar ────────────────────────────────────────────────
"yvo.hint_key_fg"          = "ansi_cyan"
"yvo.hint_bracket_fg"      = "ansi_darkgray"
"yvo.hint_key_bg"          = "#232323"
"yvo.hint_desc_fg"         = "#a0a0a0"
"yvo.hint_dim_key_fg"      = "#508ca0"
"yvo.hint_dim_bracket_fg"  = "#3c3c3c"
"yvo.hint_dim_desc_fg"     = "#646464"
"yvo.hint_bar_bg"          = "#191919"

# ── Overlays / modals ────────────────────────────────────────────────
"yvo.overlay_border"       = "ansi_cyan"
"yvo.overlay_bg"           = "#141414"
"yvo.overlay_dim_bg"       = "#0a0a0a"
"yvo.overlay_dim_fg"       = "ansi_darkgray"
"yvo.prompt_cursor"        = "ansi_cyan"

# ── Provider / branch / scrollback ───────────────────────────────────
"yvo.provider_label_fg"    = "#646464"
"yvo.branch_fg"            = "ansi_cyan"
"yvo.terminal_hint_fg"     = "#505050"
"yvo.scroll_indicator_fg"  = "#d2d2d2"
"yvo.scroll_indicator_bg"  = "#373737"
"yvo.warning_fg"           = "ansi_yellow"

# ── Buttons ──────────────────────────────────────────────────────────
"yvo.button_active_fg"     = "ansi_white"
"yvo.button_confirm_border" = "ansi_cyan"
"yvo.button_danger_border" = "ansi_red"

# ── Help overlay ─────────────────────────────────────────────────────
"yvo.help_section_header_fg" = "ansi_cyan"
"yvo.help_banner_fg"       = "#141414"
"yvo.help_banner_bg"       = "ansi_cyan"
"yvo.help_body_fg"         = "#b4b4b4"

# ── Input cursor ─────────────────────────────────────────────────────
"yvo.input_cursor_fg"      = "ansi_black"
"yvo.input_cursor_bg"      = "ansi_white"
"yvo.input_label_fg"       = "ansi_white"

# ── Misc UI surfaces ─────────────────────────────────────────────────
"yvo.runtime_context_value_fg" = "#7d96a0"
"yvo.nudge_border"         = "#b49632"
"yvo.tip_pill_fg"          = "#b4b4b4"
"yvo.tip_pill_bg"          = "#463278"
"yvo.tip_text_fg"          = "#5a5a5a"
"yvo.tip_highlight_fg"     = "#007878"
